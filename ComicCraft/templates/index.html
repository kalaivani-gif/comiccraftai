<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft - AI Comic Story Creator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="hero">
  <main class="container card">
    <div class="badge">AI COMIC CREATOR</div>
    <h1>ComicCraft</h1>
    <p class="subtitle">Turn your idea into a 5-panel comic story with AI.</p>

    <form action="/generate" method="post">
      <label>Story Prompt</label>
      <textarea name="story_prompt" required placeholder="A brave fox exploring an enchanted forest"></textarea>

      <label>Main Character Name</label>
      <input name="character_name" required placeholder="Aria">

      <label>Setting</label>
      <select name="setting">
        <option>Forest</option>
        <option>School</option>
        <option>City</option>
        <option>Space</option>
        <option>Village</option>
        <option>Custom</option>
      </select>

      <label>Story Tone</label>
      <select name="tone">
        <option>Light-hearted</option>
        <option>Dramatic</option>
        <option>Funny</option>
        <option>Poetic</option>
        <option>Adventure</option>
      </select>

      <label>Art Style</label>
      <select name="art_style">
        <option>Anime</option>
        <option>Comic book</option>
        <option>Pixel art</option>
        <option>Realistic</option>
        <option>Cartoon</option>
      </select>

      <button type="submit">✨ Generate My Comic</button>
    </form>

    <p class="hint">Tip: If no API keys are configured, ComicCraft still runs in demo/fallback mode.</p>
  </main>
</body>
</html>
